<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3000 Robux — Argo's Digi Shop</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">Argo's Digi Shop</a>

        <a href="3000-robux.html" class="active">Shop</a>

  <main>
    <section class="product-page">
      <div class="container product-layout">
        <div class="product-info">
          <p class="breadcrumb"><a href="index.html">Home</a> / 3000 Robux</p>
          <h1>3000 Robux</h1>

            <li>Fast delivery after payment</li>

        <div class="payment-box">

          <div class="iframe-wrap">
            <iframe
              src="https://nowpayments.io/embeds/payment-widget?iid=6103315017"
              width="410"
              height="696"

  <footer class="footer">
