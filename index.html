<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Argo</title>
  <meta name="description" content="Argo — digital goods.">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="intro" id="intro" aria-hidden="true">
    <span class="intro-word">Argo</span>
  </div>

  <header class="site-header">
    <div class="shell header-inner">
      <a href="index.html" class="brand">Argo</a>
      <nav class="nav" aria-label="Primary">
        <a href="index.html" aria-current="page">Shop</a>
      </nav>
    </div>
  </header>

  <main>
    <div class="shell">
      <div class="page-title">
        <h1>Shop</h1>
      </div>
      <div class="card-grid">
        <a href="3000-robux.html" class="card">
          <h2>3000 Robux</h2>
          <p class="meta">Currency credit</p>
          <span class="go">Buy</span>
        </a>
        <a href="discord-nitro.html" class="card">
          <h2>Discord Nitro — 1 Year</h2>
          <p class="meta">Subscription</p>
          <span class="go">Buy</span>
        </a>
        <a href="headless-account.html" class="card">
          <h2>Headless Account</h2>
          <p class="meta">Full account</p>
          <span class="go">Buy</span>
        </a>
        <a href="korblox-account.html" class="card">
          <h2>Korblox Account</h2>
          <p class="meta">Full account</p>
          <span class="go">Buy</span>
        </a>
        <a href="korblox-headless.html" class="card">
          <h2>Korblox &amp; Headless</h2>
          <p class="meta">Bundle</p>
          <span class="go">Buy</span>
        </a>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="shell">
      <p>Argo</p>
    </div>
  </footer>

  <script>
    (function () {
      var el = document.getElementById('intro');
      if (!el) return;
      if (sessionStorage.getItem('argo-intro')) {
        el.classList.add('done');
        return;
      }
      setTimeout(function () {
        el.classList.add('done');
        sessionStorage.setItem('argo-intro', '1');
      }, 2200);
    })();
  </script>
</body>
</html>
